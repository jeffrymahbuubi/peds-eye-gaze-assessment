# Global default configuration.
# Values here are overridden by task-specific YAML (configs/tasks/*.yaml)
# and by CLI flags. A non-engineer (therapist / RA) can safely edit this file.

app:
  fullscreen: false
  target_fps: 150
  # Physical screen used to convert normalized gaze (0-1) -> pixels when no
  # real window geometry is available (headless replay).
  screen_width_px: 1920
  screen_height_px: 1080
  # Geometry for degrees-of-visual-angle (SPEC-gazepoint-analysis-export-
  # parity.md S4.2), recorded into every session's metadata.json. Physical
  # size: null = read from the OS (QScreen.physicalSize, i.e. the monitor's
  # EDID -- sometimes wrong, so measure and override here when it matters).
  # Viewing distance is the eye-to-screen distance; 650 mm is Gazepoint's
  # nominal operating distance for the GP3 HD.
  screen_physical_width_mm: null
  screen_physical_height_mm: null
  viewing_distance_mm: 650


input:
  # "eye" = gaze pointer + dwell selection
  # "gaze_switch" = gaze pointer + keyboard/switch click
  # "switch" = mouse pointer + keyboard/switch click (for setup testing)
  mode: eye

dwell:
  threshold_ms: 800
  refractory_ms: 500
  jitter_tolerance_px: 40      # allowed jitter while dwelling
  visual_cursor: true          # show gaze cursor
  progress_ring: true          # ring progress indicator on target
  instant_feedback: true       # bright ring the instant gaze lands on target, not gated by dwell fill (SPEC item 2)
  smoothing:
    enabled: true               # smooth raw gaze before it drives the cursor/hit-testing (SPEC item 1)
    alpha: 0.35                  # 0-1: lower = smoother but laggier, higher = more responsive but jitterier

calibration:
  enabled: true         # false = skip calibration entirely on this launch (CALIBRATE_START never sent)
  points: 5             # 5 or 9 -- point layout sent to Gazepoint Control before calibrating
  show: true            # false = run calibration invisibly (CALIBRATE_SHOW STATE=0), no window pops up
  timeout_s: null        # per-point fixation duration (CALIBRATE_TIMEOUT); null = leave device default (~1.25s)
  delay_s: null           # per-point animation lead-in (CALIBRATE_DELAY); null = leave device default (~0.5s)

gazepoint:
  host: "26.113.49.235"
  port: 4242
  # Data records to subscribe to (OpenGaze ENABLE_SEND_* commands).
  enable:
    time: true
    pog_fix: true
    pog_best: true
    pupil_left: true             # LPMM/RPMM, pupil diameter in mm (one PUPILMM switch for both)
    pupil_right: true
    cursor: true
    # Raw fields recorded only for all_gaze.csv (Gazepoint Analysis export
    # parity, SPEC-gazepoint-analysis-export-parity.md S5.2); nothing in the
    # app reads them. Biometrics-kit fields (DIAL/GSR/HR/TTL) are not
    # subscribed -- their columns are written as zeros, as Analysis does
    # without the kit.
    counter: true                # CNT
    time_tick: true              # TIME_TICK -> TIMETICK
    kb: true                     # KB/KBS
    user_data: true              # USER
    pupil_left_px: true          # LPCX/LPCY/LPD/LPS/LPV (pixel pupil; NOT the mm switch above)
    pupil_right_px: true         # RPCX/RPCY/RPD/RPS/RPV
    blink: true                  # BKID/BKDUR/BKPMIN
    pix: true                    # PIXS/PIXV

recording:
  output_root: "sessions"
  save_gaze_stream: true
  # all_gaze.csv (+ fixations.csv at session close): every raw <REC> in
  # Gazepoint Analysis's own 62-column export layout, next to -- never
  # replacing -- gaze_stream.csv. ~3 MB/min at 150 Hz.
  save_all_gaze: true
  save_screen_capture: false   # requires opencv (gui extra)

theme:
  name: forest
